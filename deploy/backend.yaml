# Backend (backend/): FastAPI REST API with the deterministic forecast and the LLM orchestration.
# No Route: the API is public only through the frontend's /api proxy (deploy/frontend.yaml).
# Direct access for debugging: oc port-forward -n autonomous-cfo svc/autonomous-cfo-backend 8080:8080
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: autonomous-cfo-backend
  namespace: autonomous-cfo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: autonomous-cfo-backend
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo-backend
spec:
  failedBuildsHistoryLimit: 3
  successfulBuildsHistoryLimit: 3
  output:
    to:
      kind: ImageStreamTag
      name: autonomous-cfo-backend:latest
  source:
    type: Git
    git:
      uri: https://github.com/Bartom0077/WorksOnMyMachine_Collabothon2026.git
      ref: main
    contextDir: backend
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/python-312@sha256:2f6c7b05e9446a0121835bce4ae333ad2310a8846dff4f268870745e63558d63
  triggers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-cfo-backend
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo-backend
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"autonomous-cfo-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-cfo-backend
  template:
    metadata:
      labels:
        app: autonomous-cfo-backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/autonomous-cfo/autonomous-cfo-backend:latest
          imagePullPolicy: Always
          env:  # Database connection (libpq PG* vars; values from the existing amalfi-db secret)
            - name: PGHOST
              value: amalfi-db
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: amalfi-db
                  key: database-name
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: amalfi-db
                  key: database-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: amalfi-db
                  key: database-password
            # LLM access: OGX (OpenAI-compatible Responses API) in front of vLLM, and the MCP tool server
            - name: OGX_URL
              value: http://cfo-ogx-service.autonomous-cfo.svc.cluster.local:8321
            - name: OGX_MODEL
              value: vllm-cfo/cfo-llm
            - name: MCP_SERVER_URL
              value: http://amalfi-mcp.autonomous-cfo.svc.cluster.local:8080/mcp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-cfo-backend
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo-backend
spec:
  selector:
    app: autonomous-cfo-backend
  ports:
    - name: http
      port: 8080
      targetPort: http

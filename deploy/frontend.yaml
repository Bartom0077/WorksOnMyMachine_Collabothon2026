# Frontend (frontend/): React build served by nginx, which also proxies /api/* to the backend Service.
# The Route below is the only public entry point of the application.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: autonomous-cfo
  namespace: autonomous-cfo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: autonomous-cfo
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo
spec:
  failedBuildsHistoryLimit: 3
  successfulBuildsHistoryLimit: 3
  output:
    to:
      kind: ImageStreamTag
      name: autonomous-cfo:latest
  source:
    type: Git
    git:
      uri: https://github.com/Bartom0077/WorksOnMyMachine_Collabothon2026.git
      ref: main
    contextDir: frontend
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  resources:  # npm ci + TypeScript + Vite need more than the default build pod gets
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  triggers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-cfo
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"autonomous-cfo:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"nginx\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-cfo
  template:
    metadata:
      labels:
        app: autonomous-cfo
    spec:
      containers:
        - name: nginx
          image: image-registry.openshift-image-registry.svc:5000/autonomous-cfo/autonomous-cfo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-cfo
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo
spec:
  selector:
    app: autonomous-cfo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: autonomous-cfo
  namespace: autonomous-cfo
  labels:
    app: autonomous-cfo
  annotations:
    # LLM-backed API calls can take longer than the router's default 30 s.
    haproxy.router.openshift.io/timeout: 180s
spec:
  to:
    kind: Service
    name: autonomous-cfo
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

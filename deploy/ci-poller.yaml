apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-poller
  namespace: autonomous-cfo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-poller
  namespace: autonomous-cfo
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["builds"]
    verbs: ["get", "list"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiate"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-poller
  namespace: autonomous-cfo
subjects:
  - kind: ServiceAccount
    name: ci-poller
    namespace: autonomous-cfo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-poller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autonomous-cfo-ci-state
  namespace: autonomous-cfo
data:
  frontend-sha: none
  backend-sha: none
  mcp-sha: none
  mcp-engine-sha: none
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autonomous-cfo-ci-script
  namespace: autonomous-cfo
data:
  poll.sh: |
    #!/bin/bash
    set -euo pipefail
    NS=autonomous-cfo
    API=https://kubernetes.default.svc
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    REPO=https://api.github.com/repos/Bartom0077/WorksOnMyMachine_Collabothon2026/commits

    STATE=$(curl -fsS --cacert "$CA" -H "Authorization: Bearer ${TOKEN}" \
      "${API}/api/v1/namespaces/${NS}/configmaps/autonomous-cfo-ci-state")

    build_if_changed() {
      local key="$1"
      local path="$2"
      local bc="$3"
      local body sha last resp build phase one
      body=$(curl -fsS -H "Accept: application/vnd.github+json" -H "User-Agent: autonomous-cfo-ci" \
        "${REPO}?path=${path}&sha=main&per_page=1" || true)
      sha=$(printf '%s' "$body" | grep -o '"sha"[[:space:]]*:[[:space:]]*"[0-9a-f]\{40\}"' | head -1 | grep -o '[0-9a-f]\{40\}' || true)
      if [ -z "${sha}" ]; then
        echo "${key}: no commits yet"
        return 0
      fi
      last=$(printf '%s' "$STATE" | grep -o "\"${key}\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" | head -1 | sed 's/.*"\([^"]*\)"$/\1/' || true)
      echo "${key} remote ${sha}"
      echo "${key} last ${last}"
      if [ "$sha" = "$last" ]; then
        echo "${key}: no change"
        return 0
      fi

      resp=$(curl -fsS --cacert "$CA" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
        -X POST "${API}/apis/build.openshift.io/v1/namespaces/${NS}/buildconfigs/${bc}/instantiate" \
        -d "{\"apiVersion\":\"build.openshift.io/v1\",\"kind\":\"BuildRequest\",\"metadata\":{\"name\":\"${bc}\"}}")
      build=$(printf '%s' "$resp" | grep -o "\"name\"[[:space:]]*:[[:space:]]*\"${bc}-[0-9][0-9]*\"" | head -1 | grep -o "${bc}-[0-9][0-9]*")
      echo "${key} started ${build}"

      phase=""
      for _ in $(seq 1 60); do
        sleep 5
        one=$(curl -fsS --cacert "$CA" -H "Authorization: Bearer ${TOKEN}" \
          "${API}/apis/build.openshift.io/v1/namespaces/${NS}/builds/${build}")
        phase=$(printf '%s' "$one" | grep -o '"phase"[[:space:]]*:[[:space:]]*"[A-Za-z]*"' | head -1 | sed 's/.*"\([A-Za-z]*\)"$/\1/')
        echo "${key} phase ${phase}"
        case "$phase" in
          Complete) break ;;
          Failed|Error|Cancelled) return 1 ;;
        esac
      done
      if [ "$phase" != "Complete" ]; then
        echo "${key} build timed out"
        return 1
      fi

      curl -fsS --cacert "$CA" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/merge-patch+json" \
        -X PATCH "${API}/api/v1/namespaces/${NS}/configmaps/autonomous-cfo-ci-state" \
        -d "{\"data\":{\"${key}\":\"${sha}\"}}" >/dev/null
      echo "${key} recorded ${sha}"
    }

    fail=0
    build_if_changed frontend-sha frontend autonomous-cfo || fail=1
    build_if_changed backend-sha backend autonomous-cfo-backend || fail=1
    build_if_changed mcp-sha mcp_server amalfi-mcp || fail=1
    build_if_changed mcp-engine-sha backend/kpi_engine amalfi-mcp || fail=1  # image bundles the engine
    exit "$fail"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autonomous-cfo-ci
  namespace: autonomous-cfo
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: ci-poller
          restartPolicy: Never
          containers:
            - name: poll
              image: registry.access.redhat.com/ubi9/ubi:latest
              imagePullPolicy: IfNotPresent
              command: ["bash", "/opt/ci/poll.sh"]
              volumeMounts:
                - name: script
                  mountPath: /opt/ci
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: autonomous-cfo-ci-script
                defaultMode: 420

location /api/ {
    proxy_pass http://autonomous-cfo-backend.autonomous-cfo.svc.cluster.local:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # LLM-backed endpoints (/recommendation, /chat) can take tens of seconds.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
